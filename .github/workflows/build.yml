name: Verify Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: oniro-runner
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test conversion formatter
        run: node --test tests/conversion-formatter.test.mjs

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Oniro build tools
        run: |
          npm install -g @oniroproject/oniro-app@0.10.0
          oniro-app sdk install 6.1
          oniro-app cmdtools install

      - name: Sign and build app
        run: |
          cp build-profile.example.json5 build-profile.json5
          oniro-app sign
          oniro-app build
          test -f entry/build/default/outputs/default/entry-default-signed.hap

      - name: Upload signed HAP
        uses: actions/upload-artifact@v4
        with:
          name: unitconverter-signed-hap
          path: entry/build/default/outputs/default/entry-default-signed.hap
          if-no-files-found: error
